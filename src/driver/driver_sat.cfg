# Saturn build: like driver.cfg, but the start-up banner runs at $6000 (a temporary place, only at boot).
#   LOADER  108 bytes at $0F94: copies LCIMG into the language card and jumps to INIT.
#   LCIMG   the driver, run at $D000 in the language card.
#   BANNER  startup banner and helpers, run at $1CC0 under the hi-res screen.
#   BANK6   Saturn card: the Korean DOS code, copied by the loader into bank 6, $D000 page 1 (empty when SATLOAD = 0)
#   SATDATA room for the Saturn patch lists (zeros until tools/satpack.py fills it; unused when SATLOAD = 0)
MEMORY {
    MAIN:   start = $0F94, size = $5000, file = %O;
    LCMEM:  start = $D000, size = $3000, file = "";
    B6MEM:  start = $D000, size = $1000, file = "";
    BANMEM: start = $6000, size = $0330, file = "";
}
SEGMENTS {
    LOADER: load = MAIN, type = ro;
    LCIMG:  load = MAIN, run = LCMEM, type = ro, define = yes;
    BANNER: load = MAIN, run = BANMEM, type = ro, define = yes;
    BANK6:  load = MAIN, run = B6MEM, type = ro, define = yes, optional = yes;
    SATDATA: load = MAIN, type = ro, define = yes;
}
